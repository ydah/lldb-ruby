name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.1', '3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLDB (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lldb liblldb-dev
          # Allow ptrace for debugging (required for LLDB tests)
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
          # Find and set up lldb-server path
          LLDB_SERVER=$(find /usr/bin -name 'lldb-server*' | head -1)
          if [ -n "$LLDB_SERVER" ]; then
            echo "LLDB_DEBUGSERVER_PATH=$LLDB_SERVER" >> "$GITHUB_ENV"
          fi
      - name: Install LLDB (macOS)
        if: runner.os == 'macOS'
        run: |
          # Use Homebrew LLVM for proper development headers
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Compile C extension
        run: bundle exec rake compile
      - name: Run tests
        run: bundle exec rspec
        timeout-minutes: 10

  lldb-matrix:
    name: LLDB ${{ matrix.lldb }} / Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            lldb: '14'
            ruby: '3.0'
          - os: ubuntu-latest
            lldb: '16'
            ruby: ruby
          - os: ubuntu-latest
            lldb: '17'
            ruby: ruby
          - os: ubuntu-latest
            lldb: current
            ruby: ruby
          - os: macos-latest
            lldb: homebrew
            ruby: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLDB (Linux)
        if: runner.os == 'Linux'
        env:
          LLDB_VERSION: ${{ matrix.lldb }}
        run: |
          set -euo pipefail
          sudo apt-get update

          if [ "$LLDB_VERSION" = current ]; then
            sudo apt-get install -y llvm lldb liblldb-dev
            LLVM_BIN="$(dirname "$(command -v llvm-config)")"
          else
            sudo apt-get install -y ca-certificates curl
            curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
            chmod +x "$RUNNER_TEMP/llvm.sh"
            sudo "$RUNNER_TEMP/llvm.sh" "$LLDB_VERSION"
            sudo apt-get install -y "llvm-$LLDB_VERSION" "lldb-$LLDB_VERSION" "liblldb-$LLDB_VERSION-dev"
            LLVM_BIN="/usr/lib/llvm-$LLDB_VERSION/bin"
          fi

          test -x "$LLVM_BIN/llvm-config"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          echo "LLDB_DIR=$(dirname "$LLVM_BIN")" >> "$GITHUB_ENV"

          LLDB_SERVER="$(find "$LLVM_BIN" /usr/bin -type f -name 'lldb-server*' -print -quit 2>/dev/null || true)"
          if [ -n "$LLDB_SERVER" ]; then
            echo "LLDB_DEBUGSERVER_PATH=$LLDB_SERVER" >> "$GITHUB_ENV"
          fi

      - name: Install LLDB (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LLDB_DIR=$LLVM_PREFIX" >> "$GITHUB_ENV"

      - name: Show selected LLDB
        run: |
          llvm-config --version
          lldb --version | sed -n '1p'

      - name: Allow ptrace for debugging (Linux)
        if: runner.os == 'Linux'
        run: echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Compile C extension
        run: bundle exec rake compile

      - name: Run LLDB boundary specs
        run: bundle exec rspec spec/lldb/watchpoint_spec.rb

  package-smoke:
    name: built gem package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLDB
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lldb liblldb-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ruby

      - name: Build gem package
        run: gem build lldb.gemspec

      - name: Install built gem
        env:
          GEM_HOME: ${{ runner.temp }}/gem-home
          GEM_PATH: ${{ runner.temp }}/gem-home
        # zizmor: ignore[adhoc-packages]
        run: |
          mkdir -p "$GEM_HOME"
          # This job intentionally installs the gem built from this checkout.
          gem install ./lldb-*.gem --no-document

      - name: Load installed gem outside checkout
        working-directory: ${{ runner.temp }}
        env:
          GEM_HOME: ${{ runner.temp }}/gem-home
          GEM_PATH: ${{ runner.temp }}/gem-home
        run: |
          env -u RUBYLIB ruby -e '
            require "rubygems"
            require "lldb"

            spec = Gem.loaded_specs.fetch("lldb")
            gem_home = File.expand_path(ENV.fetch("GEM_HOME"))
            gem_path = File.expand_path(spec.full_gem_path)
            abort "loaded lldb from #{gem_path}" unless gem_path.start_with?("#{gem_home}/")

            puts "loaded lldb from #{gem_path}"
            wrapper_path = LLDB::FFIBindings.library_path
            abort "wrapper is not inside the installed gem: #{wrapper_path}" unless wrapper_path.start_with?("#{gem_path}/")
            abort "wrapper is missing: #{wrapper_path}" unless File.file?(wrapper_path)
            puts "wrapper path #{wrapper_path}"
            puts "wrapper ABI #{LLDB::FFIBindings.wrapper_abi_version}"
            puts "built LLDB #{LLDB::FFIBindings.build_lldb_version}"
            puts "runtime LLDB #{LLDB::FFIBindings.runtime_lldb_version}"
          '

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run steep check
        run: bundle exec rake steep

  binding-parity:
    name: binding parity and reproducible RBS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLDB
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lldb liblldb-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check binding parity
        run: bundle exec rake bindings:check
      - name: Check reproducible RBS
        run: bundle exec rake rbs:verify

  sanitizer:
    name: native sanitizer smoke
    runs-on: ubuntu-latest
    env:
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLDB
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lldb liblldb-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Compile sanitized wrapper
        run: bundle exec rake compile
      - name: Run sanitized lifecycle and boundary specs
        run: bundle exec rspec spec/lldb/native_handle_spec.rb spec/lldb/context_spec.rb spec/lldb/process_spec.rb

  actionlint:
    runs-on: ubuntu-latest
    name: actionlint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-latest
    name: zizmor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          version: 1.27.0
